[theme]
base = "light"
primaryColor = "#125CCF"
backgroundColor = "#F7F9FC"
secondaryBackgroundColor = "#EAF2FF"
textColor = "#132B4F"
borderColor = "#C9D8ED"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
baseFontSize = 15
headingFontSizes = ["34px", "26px", "21px", "18px", "16px", "14px"]
headingFontWeights = [700, 700, 650, 650, 600, 600]
baseRadius = "large"
buttonRadius = "medium"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false

blueColor = "#125CCF"
greenColor = "#18794E"
redColor = "#C9372C"
orangeColor = "#A95B00"
grayColor = "#5E6C84"

[theme.sidebar]
backgroundColor = "#F0F5FE"
secondaryBackgroundColor = "#E1EDFF"
textColor = "#132B4F"
borderColor = "#C9D8ED"
primaryColor = "#125CCF"
